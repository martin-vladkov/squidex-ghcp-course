# .gitleaks.toml — gitleaks v8 configuration for the Squidex repository.
#
# Every allowlist entry below has been triaged and documented.  Before adding
# a new entry, confirm the value is NOT a real credential (rotate it if there
# is any doubt) and leave a justification comment.
#
# Run locally:  gitleaks detect --source . --no-git

title = "Squidex secret-scan config"

[extend]
# Use the built-in default ruleset and extend it with our allowlists.
useDefault = true

# ---------------------------------------------------------------------------
# Global allowlist — paths that are entirely known-safe.
# ---------------------------------------------------------------------------
[allowlist]
description = "Known-safe files committed intentionally"

paths = [
  # Local TLS development certificates used for the inner-dev HTTPS loop.
  # Generated by dev/create-cert.ps1 / install-cert.ps1 — never used in prod.
  "dev/squidex-dev\\.key",
  "dev/squidex-dev\\.pfx",
  "dev/squidex-dev\\.crt",
]

regexes = [
  # Base64-encoded JSON blobs in sample / SDK demo HTML files.
  # They decode to {"u":"https://localhost:5001","a":"te..."} — localhost only.
  "ewogICJ1IjogImh0dHBzOi8vbG9jYWxob3N0",

  # Example embed token in sdk/template.html line ~75.
  # Decodes to a demo content-item reference, not an API credential.
  "eyJhIjoic3F1aWRleC13ZWJzaXRlIiwicyI6ImJsb2ciLCJpIjoiZmQxZDkz",

  # Google Maps placeholder key in appsettings.json — the adjacent comment
  # reads "CREATE YOUR OWN PLEASE"; this value is intentionally committed as
  # a documentation example.
  "AIzaSyB_Z8l3nwUxZhMJykiDUJy6bSHXXlwcYMg",

  # Local admin client-secret used exclusively by the integration TestSuite
  # against a locally-hosted Squidex instance (see tools/TestSuite/README.md).
  # The value is derived from the self-hosted seed and has no cloud impact.
  "xeLd6jFxqbXJrfmNLlO2j1apagGGGSyZJhFnIuHp4I0=",

  # TestSuite cloud fixture client-secret (ClientCloudFixture.cs).
  # Read from env-var SQUIDEX__CLIENT_SECRET at runtime; the hard-coded
  # fallback is a dead-value that never works against real infrastructure.
  "yy9x4dcxsnp1s34r2z19t88wedbzxn1tfq7uzmoxf60x",

  # Example values in appsettings.json — this file documents every optional
  # feature flag and integration.  Values are placeholders; actual secrets
  # are injected via environment variables or secrets manager at deploy time.
  "4U9IPATBRAZ2D0LOFS4P",
  "AwNBNWnlmBvyrI9jGD77hcD9Bqo1HcWtlnEKNbhn",
  "QsEi-fHqkGw2_PjJmtNHf2wg",
  "d0a0d0fe2c26469ae20987ac265b3a339fd73132",
  "idWbANxNYEF4cB368WXJhjN",
  "QGgqxd7bDHBTEkpC6fj8sbdPWgZrPrPfr3xzb3LKoec=",
  "Pdu9wdN72T33KJRFdFy1w4urBKDRzIyuKpc0OItQC2E616DuZD",

  # UUID used as a fixed test fixture ID in UsageRepositoryTests.cs.
  "3e764e15-3cf5-427f-bb6f-f0fa29a40a2d",

  # TestSuite README doc-example value (same as TestSuite shared secret above).
  "xeLd6jFxqbXJrfmNLlO2j1apagGGGSyZJhFnIuHp4I0=",
]
