name: Run — Architecture Diagram Auto-Update Check

# Runs scripts/generate-architecture.sh --check on every PR that touches a
# *.csproj file or docs/architecture.md. Fails if the committed diagram is
# stale (i.e., a ProjectReference was added or removed without regenerating).
#
# To fix a failing run, execute locally:
#   ./scripts/generate-architecture.sh
# then commit the updated docs/architecture.md.
#
# Rollback: git checkout docs/architecture.md restores the previous diagram.

on:
  push:
    branches:
      - run-*
  pull_request:
    branches:
      - run-*
    paths:
      - 'backend/**/*.csproj'
      - 'docs/architecture.md'
      - 'scripts/generate-architecture.sh'

jobs:
  diagram-check:
    name: Architecture diagram — staleness check
    runs-on: ubuntu-latest
    timeout-minutes: 5  # the check script is pure bash; > 5 min means something is wrong

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/generate-architecture.sh

      - name: Check diagram is up to date
        run: |
          echo "Running: scripts/generate-architecture.sh --check"
          bash scripts/generate-architecture.sh --check

      - name: Upload current diagram for review
        if: always()
        run: |
          echo "## Architecture diagram (current committed state)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Extract Mermaid block and post to summary for quick visualisation
          awk '/<!-- DIAGRAM-AUTO:START/{flag=1; next} /<!-- DIAGRAM-AUTO:END/{flag=0} flag' \
            docs/architecture.md >> "$GITHUB_STEP_SUMMARY"

  diagram-validate:
    name: Architecture diagram — Mermaid syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10  # npm install + Puppeteer render; > 10 min means a hang
    needs: diagram-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Note: cache: 'npm' omitted — it requires a package-lock.json which
          # this repo does not have at root level.  The global-module cache below
          # (actions/cache@v4 for ~/.npm-global) provides the equivalent benefit.

      # Cache the global npm prefix so the Mermaid CLI binary survives across
      # runs with the same pinned version.  Keyed on the exact version so an
      # upgrade invalidates automatically.
      # Rollback: remove this step — npm install will re-download every time.
      - name: Cache global npm modules
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: npm-global-${{ runner.os }}-mermaid-11.15.0

      - name: Configure npm global prefix
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Pinned to 11.15.0 (latest stable as of 2026-05-31).
      # Using @latest risks silent breakage when a new major version ships with
      # breaking CLI flags or Puppeteer API changes.  Update the pin and cache
      # key together whenever a new version is vetted.
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@11.15.0

      - name: Extract auto-generated Mermaid block
        run: |
          awk '/^```mermaid/{flag=1; next} /^```/{if(flag) exit} flag' \
            docs/architecture.md > /tmp/diagram.mmd
          echo "--- extracted diagram ---"
          cat /tmp/diagram.mmd

      - name: Render diagram (validate Mermaid syntax)
        run: |
          mmdc -i /tmp/diagram.mmd -o /tmp/diagram.svg \
            --puppeteerConfigFile <(echo '{"args":["--no-sandbox"]}')
          echo "Diagram rendered: $(du -k /tmp/diagram.svg | cut -f1) KB"

      - name: Upload rendered SVG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram-svg
          path: /tmp/diagram.svg
          retention-days: 14
